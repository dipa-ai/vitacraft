<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#cfe9fb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/vitacraft-icon-180.png" />
    <title>VitaCraft — деревня смурфиков и Витрулян</title>
    <style>
      :root {
        --cream: #fff8f0;
        --ink: #4a3f55;
        --pink: #ff8fa3;
        --mint: #a8f0d8;
        --lav: #d5b8ff;
        --panel: rgba(255, 248, 240, 0.86);
        --shadow: 0 6px 0 rgba(74, 63, 85, 0.14), 0 10px 24px rgba(74, 63, 85, 0.16);
        font-family: ui-rounded, 'Nunito', 'Segoe UI', system-ui, -apple-system, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        min-height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
        background: #cfe9fb;
        color: var(--ink);
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }

      body {
        position: fixed;
        inset: 0;
      }

      #game {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      /* UI sits above the canvas and does not capture the mouse. */
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      /* --- Crosshair --- */
      #crosshair {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 22px;
        height: 22px;
        margin: -11px 0 0 -11px;
        opacity: 0.85;
        transition: transform 0.08s ease-out;
      }

      #crosshair::before,
      #crosshair::after {
        content: '';
        position: absolute;
        background: #fff;
        border-radius: 2px;
        box-shadow: 0 0 3px rgba(74, 63, 85, 0.7);
      }

      #crosshair::before {
        left: 50%;
        top: 3px;
        width: 2px;
        height: 16px;
        margin-left: -1px;
      }

      #crosshair::after {
        top: 50%;
        left: 3px;
        height: 2px;
        width: 16px;
        margin-top: -1px;
      }

      #crosshair.hit {
        transform: scale(1.45);
      }

      /* --- Hearts --- */
      #hearts {
        position: absolute;
        left: 22px;
        bottom: 92px;
        display: flex;
        gap: 5px;
      }

      .heart {
        width: 22px;
        height: 22px;
        background: var(--pink);
        clip-path: path(
          'M11 20 C11 20 1 13.5 1 7.2 C1 3.6 3.7 1 7 1 C9 1 10.4 2.1 11 3.2 C11.6 2.1 13 1 15 1 C18.3 1 21 3.6 21 7.2 C21 13.5 11 20 11 20 Z'
        );
        filter: drop-shadow(0 2px 0 rgba(74, 63, 85, 0.22));
        transition: transform 0.14s ease-out, background 0.14s;
      }

      .heart.empty {
        background: rgba(255, 255, 255, 0.42);
      }

      .heart.pulse {
        transform: scale(1.3);
      }

      /* --- Hotbar --- */
      #hotbar {
        position: absolute;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        padding: 9px;
        background: var(--panel);
        border-radius: 20px;
        box-shadow: var(--shadow);
      }

      .slot {
        position: relative;
        width: 50px;
        height: 50px;
        flex: 0 0 50px;
        padding: 0;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.55);
        border: 3px solid transparent;
        display: grid;
        place-items: center;
        color: inherit;
        font: inherit;
        transition: transform 0.1s ease-out, border-color 0.1s;
      }

      .slot.active {
        border-color: var(--ink);
        transform: translateY(-7px) scale(1.06);
      }

      .slot .swatch {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        box-shadow: inset 0 -5px 0 rgba(0, 0, 0, 0.14), 0 2px 0 rgba(74, 63, 85, 0.18);
      }

      .slot .key {
        position: absolute;
        top: 2px;
        left: 6px;
        font-size: 10px;
        font-weight: 800;
        opacity: 0.45;
      }

      .slot .count {
        position: absolute;
        bottom: 1px;
        right: 5px;
        font-size: 12px;
        font-weight: 800;
        text-shadow: 0 1px 0 #fff;
      }

      /* --- Quest tracker --- */
      #quest {
        position: absolute;
        right: 22px;
        top: 22px;
        min-width: 220px;
        padding: 14px 18px;
        background: var(--panel);
        border-radius: 20px;
        box-shadow: var(--shadow);
        opacity: 0;
        transform: translateY(-10px);
        transition: opacity 0.3s, transform 0.3s;
      }

      #quest.show {
        opacity: 1;
        transform: none;
      }

      #quest .title {
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        opacity: 0.55;
      }

      #quest .goal {
        font-size: 17px;
        font-weight: 800;
        margin-top: 3px;
      }

      #quest .bar {
        margin-top: 9px;
        height: 10px;
        border-radius: 6px;
        background: rgba(74, 63, 85, 0.12);
        overflow: hidden;
      }

      #quest .fill {
        height: 100%;
        width: 0%;
        border-radius: 6px;
        background: linear-gradient(90deg, var(--mint), var(--pink));
        transition: width 0.4s ease-out;
      }

      /* --- Boss health bar --- */
      #bossbar {
        position: absolute;
        left: 50%;
        top: 26px;
        transform: translateX(-50%) translateY(-16px);
        width: min(560px, 76vw);
        padding: 12px 18px 14px;
        background: var(--panel);
        border-radius: 22px;
        box-shadow: var(--shadow);
        text-align: center;
        opacity: 0;
        transition: opacity 0.4s, transform 0.4s;
      }

      #bossbar.show {
        opacity: 1;
        transform: translateX(-50%);
      }

      #bossbar .name {
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 0.02em;
      }

      #bossbar .phase {
        font-size: 12px;
        font-weight: 700;
        opacity: 0.55;
      }

      #bossbar .bar {
        margin-top: 8px;
        height: 14px;
        border-radius: 8px;
        background: rgba(74, 63, 85, 0.14);
        overflow: hidden;
      }

      #bossbar .fill {
        height: 100%;
        width: 100%;
        border-radius: 8px;
        background: linear-gradient(90deg, var(--lav), var(--pink));
        transition: width 0.25s ease-out;
      }

      /* --- Speech / toasts --- */
      #toasts {
        position: absolute;
        left: 50%;
        bottom: 100px;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }

      .toast {
        padding: 11px 20px;
        background: var(--panel);
        border-radius: 18px;
        box-shadow: var(--shadow);
        font-size: 16px;
        font-weight: 700;
        max-width: 74vw;
        text-align: center;
        animation: pop 0.28s cubic-bezier(0.2, 1.5, 0.4, 1);
      }

      .toast.leaving {
        animation: fade 0.4s forwards;
      }

      @keyframes pop {
        from {
          transform: scale(0.7) translateY(14px);
          opacity: 0;
        }
      }

      @keyframes fade {
        to {
          transform: translateY(-10px);
          opacity: 0;
        }
      }

      /* --- Full-screen cards --- */
      #overlay {
        position: absolute;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: rgba(207, 233, 251, 0.72);
        backdrop-filter: blur(7px);
        pointer-events: auto;
        transition: opacity 0.35s;
      }

      #overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .card {
        max-width: 560px;
        padding: 34px 40px 38px;
        background: var(--cream);
        border-radius: 30px;
        box-shadow: 0 10px 0 rgba(74, 63, 85, 0.13), 0 24px 60px rgba(74, 63, 85, 0.22);
        text-align: center;
      }

      .card.start-card {
        width: min(900px, 92vw);
        max-width: none;
        padding: 0 0 28px;
        overflow: hidden;
      }

      .start-art {
        width: 100%;
        aspect-ratio: 1536 / 700;
        overflow: hidden;
        background: #9fd3ef;
      }

      .start-art img {
        display: block;
        width: 100%;
        height: auto;
      }

      .start-card .btn {
        margin-top: 22px;
        background: #f2c65d;
        color: #fff;
        box-shadow: 0 5px 0 #9b6640;
        text-shadow: 0 2px 0 rgba(120, 79, 49, 0.28);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .start-card .btn:active {
        box-shadow: 0 1px 0 #9b6640;
      }

      .card h1 {
        margin: 0 0 6px;
        font-size: 40px;
        letter-spacing: -0.02em;
      }

      .card h1 .accent {
        color: var(--pink);
      }

      .card p {
        margin: 0 0 6px;
        font-size: 16px;
        line-height: 1.55;
        opacity: 0.8;
      }

      .keys {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 7px 14px;
        margin: 20px auto 24px;
        text-align: left;
        font-size: 15px;
        width: fit-content;
      }

      .keys b {
        display: inline-block;
        min-width: 30px;
        padding: 3px 9px;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 0 rgba(74, 63, 85, 0.2);
        font-size: 13px;
        text-align: center;
      }

      .btn {
        display: inline-block;
        padding: 15px 38px;
        background: var(--pink);
        color: #fff;
        border: none;
        border-radius: 999px;
        font: inherit;
        font-size: 19px;
        font-weight: 900;
        cursor: pointer;
        box-shadow: 0 5px 0 #e06a80;
        transition: transform 0.1s, box-shadow 0.1s;
      }

      .btn:active {
        transform: translateY(4px);
        box-shadow: 0 1px 0 #e06a80;
      }

      #loading {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: #cfe9fb;
        font-size: 19px;
        font-weight: 800;
        color: var(--ink);
        z-index: 200;
      }

      #vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, transparent 52%, rgba(255, 80, 110, 0.55) 130%);
        opacity: 0;
        transition: opacity 0.16s;
      }

      /* --- Selected-item label: tooltips do not work under pointer lock --- */
      #itemlabel {
        position: absolute;
        left: 50%;
        bottom: 96px;
        transform: translateX(-50%);
        padding: 7px 16px;
        background: var(--panel);
        border-radius: 14px;
        box-shadow: var(--shadow);
        font-size: 13px;
        font-weight: 800;
        max-width: 70vw;
        text-align: center;
        opacity: 0;
        transition: opacity 0.2s;
      }

      #itemlabel.show {
        opacity: 1;
      }

      #itemlabel .desc {
        display: block;
        font-weight: 600;
        font-size: 12px;
        opacity: 0.7;
        margin-top: 2px;
      }

      /* --- Persistent hint for the resources panel --- */
      #tabhint {
        position: absolute;
        right: 22px;
        bottom: 20px;
        padding: 7px 12px;
        background: var(--panel);
        border-radius: 12px;
        box-shadow: var(--shadow);
        font-size: 12px;
        font-weight: 700;
        opacity: 0.75;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      #tabhint b {
        display: inline-block;
        padding: 1px 7px;
        background: #fff;
        border-radius: 6px;
        box-shadow: 0 2px 0 rgba(74, 63, 85, 0.2);
        font-size: 11px;
      }

      /* --- Resources (Tab) and controls help (Q) --- */
      #resources,
      #help {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%) scale(0.97);
        width: min(680px, 88vw);
        max-height: 76vh;
        overflow-y: auto;
        padding: 22px 26px;
        background: var(--panel);
        border-radius: 24px;
        box-shadow: var(--shadow);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.18s, transform 0.18s;
      }

      #resources.show,
      #help.show {
        opacity: 1;
        transform: translate(-50%, -50%);
      }

      #resources h2,
      #help h2 {
        margin: 0 0 12px;
        font-size: 20px;
      }

      #help {
        width: min(620px, 88vw);
      }

      #help > p {
        margin: 0;
        font-size: 14px;
        line-height: 1.5;
        opacity: 0.8;
      }

      #help .keys {
        margin: 18px auto 14px;
      }

      #help .help-footer {
        text-align: center;
        font-weight: 700;
      }

      #help .help-footer b {
        display: inline-block;
        padding: 2px 8px;
        background: #fff;
        border-radius: 7px;
        box-shadow: 0 2px 0 rgba(74, 63, 85, 0.2);
        font-size: 12px;
      }

      .res-row {
        display: grid;
        grid-template-columns: 34px 150px 1fr;
        gap: 12px;
        align-items: start;
        padding: 9px 6px;
        border-radius: 12px;
      }

      .res-row:nth-child(even) {
        background: rgba(255, 255, 255, 0.4);
      }

      .res-row .swatch {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        margin-top: 2px;
        box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.12), 0 2px 0 rgba(74, 63, 85, 0.15);
      }

      .res-row .name {
        font-weight: 800;
        font-size: 14px;
        padding-top: 4px;
      }

      .res-row .info {
        font-size: 13px;
        line-height: 1.45;
        opacity: 0.85;
      }

      .res-row .info .src {
        display: block;
        margin-top: 2px;
        font-weight: 700;
        color: #7a6b8f;
      }

      /* --- Touch controls --- */
      #mobile-controls {
        display: none;
        position: absolute;
        inset: 0;
        pointer-events: none;
        touch-action: none;
      }

      body.touch-mode #mobile-controls {
        display: block;
      }

      #touch-look {
        position: absolute;
        z-index: 10;
        inset: 0 0 0 28%;
        pointer-events: auto;
        touch-action: none;
      }

      #touch-stick {
        position: absolute;
        z-index: 35;
        left: max(10px, env(safe-area-inset-left));
        bottom: max(8px, env(safe-area-inset-bottom));
        width: 132px;
        height: 132px;
        display: grid;
        place-items: center;
        pointer-events: auto;
        touch-action: none;
      }

      #touch-stick-base {
        width: 100px;
        height: 100px;
        display: grid;
        place-items: center;
        border: 3px solid rgba(255, 255, 255, 0.72);
        border-radius: 50%;
        background: rgba(74, 63, 85, 0.2);
        box-shadow: inset 0 0 0 7px rgba(255, 255, 255, 0.12), var(--shadow);
      }

      #touch-stick-knob {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: rgba(255, 248, 240, 0.92);
        border: 3px solid rgba(74, 63, 85, 0.22);
        box-shadow: 0 4px 0 rgba(74, 63, 85, 0.22);
        will-change: transform;
      }

      #touch-actions {
        position: absolute;
        z-index: 35;
        right: max(10px, env(safe-area-inset-right));
        bottom: max(8px, env(safe-area-inset-bottom));
        display: grid;
        grid-template-columns: repeat(2, 58px);
        gap: 8px;
        pointer-events: none;
      }

      .touch-button {
        width: 58px;
        height: 58px;
        padding: 4px;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 1px;
        border: 3px solid rgba(255, 255, 255, 0.78);
        border-radius: 50%;
        background: rgba(74, 63, 85, 0.68);
        color: #fff;
        font: inherit;
        font-size: 25px;
        font-weight: 900;
        line-height: 1;
        box-shadow: 0 5px 0 rgba(47, 39, 58, 0.48), 0 8px 18px rgba(47, 39, 58, 0.22);
        pointer-events: auto;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }

      .touch-button small {
        font-size: 8px;
        font-weight: 900;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }

      .touch-button:active {
        transform: translateY(3px) scale(0.96);
        box-shadow: 0 2px 0 rgba(47, 39, 58, 0.48);
      }

      #touch-attack {
        background: rgba(224, 106, 128, 0.84);
      }

      #touch-place {
        background: rgba(106, 156, 136, 0.84);
      }

      #touch-toolbar {
        position: absolute;
        z-index: 60;
        top: max(10px, env(safe-area-inset-top));
        right: max(10px, env(safe-area-inset-right));
        display: grid;
        grid-template-columns: repeat(5, 44px);
        gap: 6px;
        pointer-events: none;
      }

      #touch-toolbar .touch-button {
        width: 44px;
        height: 44px;
        border-width: 2px;
        font-size: 18px;
        box-shadow: 0 3px 0 rgba(47, 39, 58, 0.42);
      }

      #touch-fullscreen {
        display: none;
      }

      #touch-fullscreen.supported {
        display: grid;
      }

      body.touch-panel-open #touch-look,
      body.touch-panel-open #touch-stick,
      body.touch-panel-open #touch-actions {
        opacity: 0;
        pointer-events: none;
      }

      body.touch-panel-open #touch-actions .touch-button {
        pointer-events: none;
      }

      body.touch-panel-open #hotbar,
      body.touch-panel-open #itemlabel {
        opacity: 0;
        pointer-events: none;
      }

      body.touch-panel-open #crosshair,
      body.touch-panel-open #hearts,
      body.touch-panel-open #quest,
      body.touch-panel-open #bossbar,
      body.touch-panel-open #toasts {
        opacity: 0;
      }

      body.touch-mode #hotbar {
        z-index: 40;
        bottom: max(8px, env(safe-area-inset-bottom));
        width: clamp(220px, calc(100vw - 320px), 520px);
        max-width: clamp(220px, calc(100vw - 320px), 520px);
        gap: 5px;
        padding: 5px;
        overflow-x: auto;
        overflow-y: hidden;
        pointer-events: auto;
        touch-action: pan-x;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }

      body.touch-mode #hotbar::-webkit-scrollbar {
        display: none;
      }

      body.touch-mode .slot {
        width: 42px;
        height: 42px;
        flex-basis: 42px;
        border-width: 2px;
        border-radius: 12px;
        -webkit-tap-highlight-color: transparent;
      }

      body.touch-mode .slot.active {
        transform: scale(1.06);
      }

      body.touch-mode .slot .key {
        display: none;
      }

      body.touch-mode .slot .swatch {
        width: 25px;
        height: 25px;
      }

      body.touch-mode #tabhint {
        display: none;
      }

      body.touch-mode #hearts {
        top: max(12px, env(safe-area-inset-top));
        bottom: auto;
        left: max(14px, env(safe-area-inset-left));
        width: 130px;
        flex-wrap: wrap;
        gap: 3px;
      }

      body.touch-mode #bossbar {
        width: clamp(220px, calc(100vw - 300px), 440px);
      }

      body.touch-mode #quest {
        top: max(10px, env(safe-area-inset-top));
        right: max(258px, calc(env(safe-area-inset-right) + 248px));
        min-width: 180px;
        max-width: 230px;
        padding: 9px 12px;
      }

      body.touch-mode #quest .goal {
        font-size: 14px;
      }

      body.touch-mode #toasts {
        bottom: max(70px, calc(env(safe-area-inset-bottom) + 62px));
      }

      body.touch-mode #itemlabel {
        bottom: max(68px, calc(env(safe-area-inset-bottom) + 60px));
      }

      body.touch-mode #resources.show,
      body.touch-mode #help.show {
        z-index: 50;
        pointer-events: auto;
        touch-action: pan-y;
        -webkit-overflow-scrolling: touch;
        background: rgba(255, 248, 240, 0.97);
      }

      body.touch-mode .card {
        max-width: min(560px, 92vw);
        padding: 24px 26px 28px;
      }

      body.touch-mode .card.start-card {
        padding: 0 0 20px;
      }

      #rotate-device {
        display: none;
        position: absolute;
        inset: 0;
        z-index: 300;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        place-items: center;
        background: #cfe9fb;
        pointer-events: auto;
        text-align: center;
      }

      #rotate-device .rotate-card {
        display: grid;
        justify-items: center;
        gap: 8px;
        max-width: 320px;
        padding: 26px 30px;
        border-radius: 28px;
        background: var(--cream);
        box-shadow: var(--shadow);
      }

      #rotate-device .rotate-icon {
        font-size: 48px;
        line-height: 1;
      }

      #rotate-device strong {
        font-size: 22px;
      }

      #rotate-device span:last-child {
        font-size: 14px;
        line-height: 1.4;
        opacity: 0.72;
      }

      @media (orientation: landscape) and (max-height: 500px) {
        body.touch-mode #resources,
        body.touch-mode #help {
          width: min(680px, calc(100vw - 32px));
          max-height: calc(100dvh - 72px);
          padding: 16px 20px;
        }

        body.touch-mode #resources h2,
        body.touch-mode #help h2 {
          margin-bottom: 7px;
          font-size: 18px;
        }

        body.touch-mode #help > p {
          font-size: 12px;
          line-height: 1.35;
        }

        body.touch-mode #help .keys {
          margin: 10px auto 8px;
          gap: 4px 8px;
          font-size: 12px;
        }

        body.touch-mode #help .keys b {
          padding: 2px 7px;
          font-size: 11px;
        }

        body.touch-mode #help .help-footer {
          font-size: 12px;
        }

        body.touch-mode .res-row {
          grid-template-columns: 28px 120px 1fr;
          gap: 8px;
          padding: 6px 4px;
        }
      }

      @media (orientation: portrait) {
        body.touch-mode #rotate-device {
          display: grid;
        }

        body.touch-mode #bossbar {
          top: max(64px, calc(env(safe-area-inset-top) + 54px));
          left: max(10px, env(safe-area-inset-left));
          width: calc(100vw - 126px - env(safe-area-inset-left));
          transform: translateY(-16px);
        }

        body.touch-mode #bossbar.show {
          transform: none;
        }

        body.touch-mode #quest {
          top: max(148px, calc(env(safe-area-inset-top) + 138px));
          max-width: 190px;
        }

        body.touch-mode #hotbar {
          left: 10px;
          right: 10px;
          bottom: max(172px, calc(env(safe-area-inset-bottom) + 164px));
          width: auto;
          max-width: none;
          transform: none;
        }

        body.touch-mode #itemlabel {
          bottom: max(232px, calc(env(safe-area-inset-bottom) + 224px));
        }

        body.touch-mode #toasts {
          bottom: max(242px, calc(env(safe-area-inset-bottom) + 234px));
        }

        body.touch-mode #resources,
        body.touch-mode #help {
          width: 94vw;
          max-height: 68dvh;
          padding: 18px;
        }

        body.touch-mode .keys {
          font-size: 13px;
          gap: 6px 9px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="ui">
      <div id="vignette"></div>
      <div id="crosshair"></div>
      <div id="hearts"></div>
      <div id="hotbar"></div>
      <div id="itemlabel"></div>
      <div id="tabhint">
        <span><b>Tab</b> — ресурсы</span>
        <span><b>Q</b> — управление</span>
      </div>

      <div id="quest">
        <div class="title">Испытание</div>
        <div class="goal">—</div>
        <div class="bar"><div class="fill"></div></div>
      </div>

      <div id="bossbar">
        <div class="name">Витрулян</div>
        <div class="phase">Фаза 1</div>
        <div class="bar"><div class="fill"></div></div>
      </div>

      <div id="toasts"></div>

      <div id="resources">
        <h2>Ресурсы — что это и где взять</h2>
        <div class="list"></div>
      </div>

      <div id="help"></div>

      <div id="mobile-controls" aria-hidden="true">
        <div id="touch-look" aria-label="Поворот камеры"></div>

        <div id="touch-stick" aria-label="Движение">
          <div id="touch-stick-base">
            <div id="touch-stick-knob"></div>
          </div>
        </div>

        <div id="touch-actions">
          <button class="touch-button" id="touch-throw" type="button" aria-label="Бросить облачко">
            <span aria-hidden="true">☁</span><small>бросить</small>
          </button>
          <button class="touch-button" id="touch-jump" type="button" aria-label="Прыгнуть">
            <span aria-hidden="true">↑</span><small>прыжок</small>
          </button>
          <button class="touch-button" id="touch-place" type="button" aria-label="Поставить или использовать">
            <span aria-hidden="true">＋</span><small>ставить</small>
          </button>
          <button class="touch-button" id="touch-attack" type="button" aria-label="Ломать или ударить">
            <span aria-hidden="true">⛏</span><small>ломать</small>
          </button>
        </div>

        <div id="touch-toolbar">
          <button class="touch-button" id="touch-pause" type="button" aria-label="Пауза">Ⅱ</button>
          <button
            class="touch-button"
            id="touch-fullscreen"
            type="button"
            aria-label="На весь экран"
            aria-pressed="false"
          >
            ⛶
          </button>
          <button class="touch-button" id="touch-camera" type="button" aria-label="Сменить камеру">◉</button>
          <button class="touch-button" id="touch-resources" type="button" aria-label="Ресурсы">▦</button>
          <button class="touch-button" id="touch-help" type="button" aria-label="Управление">?</button>
        </div>
      </div>

      <div id="rotate-device" role="status">
        <div class="rotate-card">
          <span class="rotate-icon" aria-hidden="true">↻</span>
          <strong>Поверните телефон</strong>
          <span>VitaCraft рассчитан на горизонтальный экран</span>
        </div>
      </div>

      <div id="overlay">
        <div class="card" id="overlay-card"></div>
      </div>
    </div>

    <div id="loading">Растим холмики…</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
