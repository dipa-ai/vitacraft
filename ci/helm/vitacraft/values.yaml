replicaCount: 1

image:
  repository: registry.luxembourg-2.cloud.gcore.dev/59508-197526-76-infra/vitacraft
  pullPolicy: IfNotPresent
  # Defaults to Chart.appVersion when empty.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

containerPort: 8080

service:
  type: ClusterIP
  port: 80

httpRoute:
  annotations: {}
  # Replace this with the Gateway name used by the target cluster.
  parentRefs:
    - name: gateway
  # An empty list accepts every hostname allowed by the Gateway listener.
  hostnames: []
  path:
    type: PathPrefix
    value: /

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
